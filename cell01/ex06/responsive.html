<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 06: Responsive</title>
    <style>
        /* ลบ margin/padding ของหน้าเว็บ และตั้งค่าให้ html, body สูงเต็ม 100% */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* กำหนดให้ตารางขยายเต็มหน้าจอทั้งกว้างและสูง */
        table {
            width: 100%;
            height: 100vh; /* 100vh คือเต็มความสูงของหน้าจอเบราว์เซอร์ */
            border-collapse: collapse;
            border: 1px solid #000;
        }

        td {
            border: 1px solid #000;
            font-family: sans-serif;
            font-size: 18px;
            vertical-align: middle;
            text-align: center;
        }

        .cell-1 {
            background-color: #7accc9;
            width: 45%;
        }

        .cell-2 {
            background-color: #fbb0d8;
            width: 55%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-1">hello1</td>
            <td class="cell-2">hello2</td>
        </tr>
    </table>

</body>
</html>
