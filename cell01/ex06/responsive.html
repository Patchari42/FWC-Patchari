<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                height: 100%;
                table-layout: fixed;
            }
            td {
                width: 50%;
                vertical-align: bottom;
            }
            .first {
                background-color: #b5bd68;
            }
            .second {
                background-color: #f2bfa4;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="first">First cell</td>
                <td class="second">Second cell</td>
            </tr>
        </table>
    </body>
</html>
