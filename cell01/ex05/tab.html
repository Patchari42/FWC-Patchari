<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            height: 150px;
            border: 1px solid black;
            padding: 10px;
            vertical-align: center;
        }

        .first-cell {
            background-color: #ffb6c1;
            width: 50%;
        }

        .second-cell {
            background-color: #ffe5b4;
            width: 50%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">hello world 1</td>
            <td class="second-cell">hello world 2</td>
        </tr>
    </table>

</body>
</html>
